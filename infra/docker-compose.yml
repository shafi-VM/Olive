# Olive — one-command stack. Run from repo root:  docker compose -f infra/docker-compose.yml up --build
name: olive

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olive}
      POSTGRES_DB: ${POSTGRES_DB:-olive}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-olive}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Prisma migrations, then exits. Gates the app services.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: ['pnpm', '--filter', '@olive/db', 'run', 'migrate:deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-olive}:${POSTGRES_PASSWORD:-olive}@postgres:5432/${POSTGRES_DB:-olive}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-olive}:${POSTGRES_PASSWORD:-olive}@postgres:5432/${POSTGRES_DB:-olive}?schema=public
      REDIS_URL: redis://redis:6379
      INGESTION_URL: http://ingestion:4001
      API_PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-gemini}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-2.0-flash}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestion:
    build:
      context: ..
      dockerfile: Dockerfile.ingestion
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-olive}:${POSTGRES_PASSWORD:-olive}@postgres:5432/${POSTGRES_DB:-olive}?schema=public
      REDIS_URL: redis://redis:6379
      INGESTION_PORT: 4001
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        # Build-time: the URL the browser (not the container) calls.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
